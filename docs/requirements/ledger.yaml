  # READ — crawlers, assistants, API
  # ---------------------------------------------------------------------------

  - id: READ-001
    title: Server-rendered content for crawlers covers resume, projects and catalog
    job: read
    area: seo
    priority: p0
    done_means:
      - "curl of / (no JS) contains the current job title, every project name from projects.json, every service name from services.json and the profile links (a test renders the SSR HTML or fetches the preview server and asserts)."
    status: todo
