      - api/test_app.py::test_contact_without_token_is_503
      - api/test_app.py::test_contact_upstream_failure_is_502_and_token_not_logged
      - api/test_app.py::test_404_handler
    notes:
      - "2026-11-05: added at Mark's request. Rate-limit table is a module-level dict per gunicorn worker (so up to 3 x workers per hour), documented in app.py. nginx /api/ route on www and the NTFY env on flask-api landed in 83rr-poweredge #31."

