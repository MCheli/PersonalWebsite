      - "CLAUDE.md (read-first list, rules, quick start, layout), docs/PRODUCT.md, docs/ARCHITECTURE.md, docs/CONTRIBUTING-FEATURES.md (how to add a command, a content field, a page, an API endpoint, with the evidence each needs) exist and agree with the code; README.md is a short human overview pointing at them."
    status: todo
    evidence: []
    notes: []

  # ---------------------------------------------------------------------------
  # NFR
  # ---------------------------------------------------------------------------

  - id: NFR-SEC-001
    title: Security headers and self-hosted font
    job: read
    area: frontend
    priority: p1
    done_means:
      - "JetBrains Mono is served from the site (npm @fontsource/jetbrains-mono or committed woff2), not Google Fonts, so no third-party request is made on page load (test: built HTML has no fonts.googleapis.com)."
      - "Existing headers (nosniff, frame-ancestors none, referrer policy, permissions policy) stay; the build-smoke in CI proves the page still loads with them."
    status: todo
    evidence: []
    notes: []

  - id: NFR-MOB-001
    title: Input does not zoom on iOS and the keyboard fits
    job: show
    area: terminal
    priority: p1
    visible: true
    done_means:
      - "The command input has font-size >= 16px, autocapitalize=off, autocorrect=off, spellcheck=false, enterkeyhint=go; the suggestion/hint row has no fixed 250px margin; at 390px the prompt and input sit on one line and the command bar stays reachable."
    status: todo
    evidence: []
    notes: []
