  - id: READ-002
    title: JSON-LD, titles and OG from resume.json
    job: read
    area: seo
    priority: p1
    done_means:
      - "JSON-LD on / is a Person with name, jobTitle, worksFor, address locality, sameAs and url read from resume.json (test parses the script tag); /resume carries the same Person."
      - "og:image and twitter:image point at /og.png, a committed 1200x630 PNG generated by `make og-image`; <title> and description derive from resume.json basics."
    status: todo
    evidence: []
    notes: []

  - id: READ-003
    title: Sitemap and robots list the real pages
    job: read
    area: seo
    priority: p1
    done_means:
      - "public/sitemap.xml lists /, /resume, /projects and the ?cmd= entries for every command the registry marks as `deepLink: true`; robots.txt allows all and points at the sitemap. A test compares the sitemap to the registry so a new command cannot be forgotten."
    status: todo
    evidence: []
    notes: []

  - id: READ-004
    title: API serves resume, projects, services, profile as JSON
    job: read
    area: api
    priority: p1
    done_means:
      - "GET /resume returns content/resume.json; GET /projects returns content/projects.json; GET /services and GET /profile as before; all with CORS headers; the 404 handler lists every endpoint (tests for each)."
    status: todo
    evidence: []
    notes: []

  - id: READ-005
    title: Weather is cached and never leaks the key
    job: read
    area: api
    priority: p1
    done_means:
      - "/weather caches the upstream response for 10 minutes so a burst of visitors makes one OpenWeatherMap call (test with a mocked requests.get counts calls); the existing redaction tests still pass; timestamps are timezone-aware ISO strings (no utcnow deprecation warning in the test run)."
    status: todo
    evidence: []
    notes: []

  # ---------------------------------------------------------------------------
  # MAINTAIN — keeping it true
  # ---------------------------------------------------------------------------

  - id: MAINT-001
    title: Catalog drift check against the homelab compose file
    job: maintain
    area: tooling
    priority: p0
    done_means:
      - "`make catalog-check` (scripts/check_catalog.py) downloads docker-compose.yml and infrastructure/openclaw/docker-compose.yml from MCheli/83rr-poweredge main, collects container_name values, and fails listing (a) containers not in services.json and (b) catalog entries whose containers are not in compose; `external: true` entries and `containers: []` entries are skipped. It also HEAD/GETs every public https url in services.json and projects.json and fails on non-2xx/3xx (LAN-only urls skipped)."
      - "A unit test runs the diff logic on fixture compose text. CI runs the check on PRs (url check allowed to warn) and weekly on a schedule (hard fail)."
    status: todo
    evidence: []
    notes:
      - "2026-11-05: the catalog listed marimo and a voice-ai category that no longer exist, and missed uptime-kuma, ntfy, Dependency-Track, ASA and four databases."

  - id: MAINT-002
    title: Requirements ledger gate
    job: maintain
    area: tooling
    priority: p0
    done_means:
