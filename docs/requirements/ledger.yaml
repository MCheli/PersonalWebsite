# markcheli.com requirements ledger.
# Source of truth for scope: docs/PRODUCT.md. Schema and rules: docs/ARCHITECTURE.md "Requirements ledger".
# Gate: `make ledger-check` (scripts/ledger_check.py), also run by CI and `make pre-commit`.
#
# Every entry starts as todo with no evidence. It becomes done only with evidence:
#   - a test that exercises the real code path:  api/test_app.py::<test_fn>  or  frontend/tests/<file>.test.ts#<title>
#   - for anything visible (visible: true):      artifacts/screens/<route-or-command>/<viewport>.png from `make tour`
#
# jobs:  identify (who Mark is) · show (resume, projects, homelab) · reach (contact) · read (crawlers, assistants, API)
#        · maintain (Mark and the agents keeping it true)
# "the tour" = scripts/screenshot_tour.mjs at 390px (mobile) and 1440px (desktop).
#
# Created 2026-11-05 from docs/PRODUCT.md and docs/REVIEW-2026-11-05.md.

requirements:

  # ---------------------------------------------------------------------------
  # IDENTIFY — first screen
  # ---------------------------------------------------------------------------

  - id: IDENT-001
    title: First screen states who Mark is without typing
    job: identify
    area: terminal
    priority: p0
    visible: true
    done_means:
      - "On / at 390px and 1440px, before any command, the page shows Mark's name, 'Director, Product Operations & Strategy' and 'Onshape' plus the one-sentence summary from resume.json basics, as visible text (not only in the sr-only block)."
      - "The text is server-rendered: curl of / contains it."
    status: todo
    evidence: []
    notes:
      - "2026-11-05: today the first screen is a fake 'Last login' line, a figlet and host specs; the title says 'Developer'."

  - id: IDENT-002
    title: Figlet replaced by the name on narrow screens
    job: identify
    area: terminal
    priority: p0
    visible: true
    done_means:
      - "At 390px the MARK CHELI figlet is not rendered (or is hidden) and the name appears as large text; nothing overflows horizontally (document.scrollingElement.scrollWidth <= innerWidth in the tour)."
      - "At 1440px the figlet renders as today."
    status: todo
    evidence: []
    notes: []

  - id: IDENT-003
    title: No fake system facts
    job: identify
    area: terminal
    priority: p1
    done_means:
      - "No 'Last login ... from local-machine', no 'Status: Operational', no fake ls listing with invented file sizes anywhere in the rendered output or the command registry (a test greps the registry output for those strings)."
    status: todo
    evidence: []
    notes: []

  # ---------------------------------------------------------------------------
  # SHOW — resume, projects, homelab, now
  # ---------------------------------------------------------------------------

  - id: SHOW-001
    title: resume command renders resume.json
    job: show
    area: terminal
    priority: p0
    visible: true
    done_means:
      - "`resume` prints the headline, the current role with its highlights, previous roles one line each (position, company, dates), education, and skills by group, all read from content/resume.json (test changes a fixture value and sees it in the output)."
      - "The output ends with links to /resume and /Mark-Cheli-Resume.pdf."
    status: todo
    evidence: []
    notes: []

  - id: SHOW-002
    title: /resume page is readable and printable
    job: show
    area: resume-page
    priority: p0
    visible: true
    done_means:
      - "GET /resume server-renders every work entry, education, certificates, skills and the profile links from resume.json; the page footer shows the `meta.lastModified` date; a Download PDF link points at /Mark-Cheli-Resume.pdf."
      - "At 390px nothing overflows; at print media the page is black on white with no terminal chrome."
    status: todo
    evidence: []
    notes: []

  - id: SHOW-003
    title: Resume PDF generated from the page and kept current
    job: show
    area: resume-page
    priority: p1
    done_means:
      - "`make resume-pdf` writes frontend/public/Mark-Cheli-Resume.pdf from /resume via Playwright print media; the file is committed."
      - "`make check-resume-pdf` (run in CI) fails when content/resume.json's meta.lastModified is newer than the date embedded in the PDF's metadata or sidecar."
    status: todo
    evidence: []
    notes: []

  - id: SHOW-004
    title: projects command and detail view
    job: show
    area: terminal
    priority: p0
    visible: true
    done_means:
      - "`projects` lists featured projects first with name, tagline, stack and links; `projects all` lists every project; `projects <slug>` prints the full description and highlights; an unknown slug says so and lists the valid ones."
    status: todo
    evidence: []
    notes: []

  - id: SHOW-005
    title: /projects page with anchors
    job: show
    area: projects-page
    priority: p0
    visible: true
    done_means:
      - "GET /projects server-renders a card per project from projects.json with an id equal to its slug; featured projects come first; cards show stack chips and repo / live / demo links; at 390px nothing overflows."
    status: todo
    evidence: []
    notes: []

  - id: SHOW-006
    title: homelab catalog from services.json, readable on a phone
    job: show
    area: terminal
    priority: p0
    visible: true
    done_means:
      - "`homelab` (and `services`) renders every category and service from content/services.json with counts derived from the data; at 390px each service wraps onto its own lines (name, url, description) with no horizontal scroll; at 1440px the category layout is columnar as today."
    status: todo
    evidence: []
    notes: []

  - id: SHOW-007
    title: now command
    job: show
    area: terminal
    priority: p2
    done_means:
      - "`now` prints the items from content/now.json with its updated date. Nothing in it or anywhere on the site reads as job-seeking (a test greps all command output for 'open to', 'hire me', 'looking for')."
    status: todo
    evidence: []
    notes: []

  - id: SHOW-008
    title: Command bar of tappable commands
    job: show
    area: terminal
    priority: p0
    visible: true
    done_means:
      - "Chips for about, projects, resume, homelab, contact, help are visible on / at 390px (sticky above the keyboard) and at 1440px (under the prompt); tapping one runs the command and the output appears, identical to typing it (component test clicks a chip and asserts the output)."
    status: todo
    evidence: []
    notes: []

