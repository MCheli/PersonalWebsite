name: Build and Publish Docker Images

on:
  push:
    branches: [master]
  # PRs run every gate, the screenshot tour, and build both images but never log in or push.
  pull_request:
    branches: [master]
  # Weekly rebuild on a freshly pulled base so OS security fixes land without a code change.
  # Friday 08:00 UTC, so Saturday's security sweep sees the result.
  schedule:
    - cron: '0 8 * * 5'
    # Monday 09:00 UTC: catalog drift check with the URL check enforced (catalog-drift job).
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: '3.11'

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same list as `make pre-commit`. Both images publish only after this passes,
  # on push and on the weekly rebuild alike.
  test:
    # The Monday schedule is the drift check only; the Friday one rebuilds the images.
    if: github.event_name != 'schedule' || github.event.schedule == '0 8 * * 5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install API dependencies
        working-directory: api
        run: pip install -r requirements.txt

      - name: ruff (api + scripts)
        working-directory: api
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts

      - name: API and script tests
        working-directory: api
        run: pytest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # --ignore-scripts skips `nuxt prepare` (build and typecheck run it) and Playwright's
        # browser download (only the tour job needs a browser).
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: ESLint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: ESLint (scripts, run from the repo root so scripts/ is inside the base path)
        run: frontend/node_modules/.bin/eslint --config frontend/eslint.config.mjs scripts

      - name: nuxi typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:run

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Content check (JSON Schemas + rules)
        run: python scripts/content_check.py

      - name: Requirements ledger
        run: python scripts/ledger_check.py

      - name: Catalog drift (URL failures warn here; the Monday job enforces them)
        run: python scripts/check_catalog.py --urls-warn-only

      - name: Resume PDF is current
        run: python scripts/check_resume_pdf.py

  # Screenshot tour on every PR: the built site at 390px and 1440px, downloadable from the run.
  tour:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Screenshot tour (fails on horizontal overflow)
        run: node scripts/screenshot_tour.mjs --out artifacts/tour

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshot-tour
          path: artifacts/tour/
          if-no-files-found: warn
          retention-days: 14

  # Weekly, Monday 09:00 UTC: catalog vs the live compose file AND every public URL, hard fail.
  # A failure emails the repo owner (GitHub's scheduled-workflow failure notification).
  catalog-drift:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt

      - name: Catalog drift and public URLs (hard fail)
        run: python scripts/check_catalog.py

  build-frontend:
    needs: test
    # Watchtower deploys :latest, so only master ever publishes (manual runs on other branches skip).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/mcheli/personal-website
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }}

      - name: Smoke test the image (healthy, slim, serves static assets)
        if: github.event_name == 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE=$(echo "$TAGS" | head -n1)
          docker run -d --name smoke -p 3000:3000 "$IMAGE"
          for _ in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break; sleep 2
          done
          docker logs smoke
          [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ]
          # Nitro serves .output/public itself (no symlink hack in the Dockerfile): prove it.
          curl -fsS -o /dev/null http://127.0.0.1:3000/favicon.png
          curl -fsS -o /dev/null http://127.0.0.1:3000/og.png
          ASSET=$(curl -fsS http://127.0.0.1:3000/ | grep -o '/_nuxt/[A-Za-z0-9_.-]*\.js' | head -n1)
          [ -n "$ASSET" ] && curl -fsS -o /dev/null "http://127.0.0.1:3000$ASSET"
          docker run --rm --entrypoint sh "$IMAGE" -c '! command -v curl && ! command -v npm && ! command -v npx && ! command -v corepack'
          docker image inspect -f 'image size: {{.Size}} bytes' "$IMAGE"

  build-api:
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/mcheli/flask-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }}

      - name: Smoke test the image (healthy, slim, serves the content endpoints)
        if: github.event_name == 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE=$(echo "$TAGS" | head -n1)
          docker run -d --name smoke -p 5000:5000 "$IMAGE"
          for _ in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break; sleep 2
          done
          docker logs smoke
          [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ]
          for ep in /resume /projects /services /profile /now; do curl -fsS -o /dev/null "http://127.0.0.1:5000$ep"; done
          docker run --rm --entrypoint sh "$IMAGE" -c '! command -v curl'
          docker run --rm --entrypoint python "$IMAGE" -c "import setuptools; print('setuptools', setuptools.__version__)"
          docker image inspect -f 'image size: {{.Size}} bytes' "$IMAGE"
