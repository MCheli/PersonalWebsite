# Weekly dependency updates. Base-image bumps (docker) pair with the Friday fresh-base rebuild in CI:
# the rebuild picks up OS fixes inside a tag, these PRs move the tag itself.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - "/frontend"
      - "/api"
    schedule:
      interval: weekly
    ignore:
      # A Python minor bump changes the wheels the lockfile resolved; do those by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Stay on the current Node major (LTS line).
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # requirements.txt is the pinned lockfile compiled from requirements.in; app libraries move only here.
  - package-ecosystem: pip
    directories:
      - "/api"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Nuxt, vitest, eslint, playwright, vue-tsc: one PR a week for minor+patch, majors on their own.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # vue-tsc 3.x does not run on TypeScript 7 (ERR_PACKAGE_PATH_NOT_EXPORTED ./lib/tsc); bump by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node tracks the runtime major in .nvmrc (22); a newer major is wrong, not an update.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Nuxt majors are a migration (breaking config and layout), done deliberately, not by bot.
      - dependency-name: nuxt
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nuxt/vite-builder"
        update-types: ["version-update:semver-major"]
